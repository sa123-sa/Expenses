<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Ledger</title>
    
    <!-- PWA Installation Tags -->
    <meta name="theme-color" content="#217346">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">

    <style>
        body { font-family: Arial, sans-serif; margin: 16px; font-size: 14px; background-color: #f4f6f8; color: #333; }
        h3 { margin-bottom: 12px; margin-top: 25px; color: #217346; border-bottom: 2px solid #217346; padding-bottom: 5px; display: inline-block; }
        h3:first-child { margin-top: 0; }
        
        /* Tables */
        .table-container { overflow-x: auto; margin-bottom: 20px; background: #fff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        table { width: 100%; min-width: 650px; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #eee; padding: 10px; text-align: left; }
        th { background-color: #f9fafb; font-weight: bold; color: #555; font-size: 13px; text-transform: uppercase; }
        
        /* Compact Two-Line Form Inputs */
        .entry-form { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: grid; grid-template-columns: 140px 1fr 140px; gap: 10px; margin-bottom: 25px; }
        .form-row-bottom { display: grid; grid-template-columns: 1fr 1fr 120px; gap: 10px; grid-column: span 3; align-items: end; }
        
        .input-group { display: flex; flex-direction: column; gap: 4px; }
        .input-group label { font-size: 11px; font-weight: bold; color: #777; }
        input, select { width: 100%; box-sizing: border-box; border: 1px solid #ccc; padding: 6px; font-size: 13px; border-radius: 4px; }
        input:focus, select:focus { border: 1px solid #217346; outline: none; box-shadow: 0 0 3px rgba(33,115,70,0.3); }
        
        .amt { text-align: right; }
        
        /* Buttons */
        button { cursor: pointer; padding: 6px 10px; border-radius: 4px; font-size: 13px; font-weight: bold; border: none; transition: 0.2s; }
        .btn-add { background: #217346; color: white; width: 100%; padding: 8px; }
        .btn-add:hover { background: #1a5c38; }
        
        .action-btns { display: flex; gap: 4px; justify-content: flex-end; }
        .btn-del { color: #d32f2f; background: #ffebee; padding: 4px 8px; font-size: 12px; }
        .btn-edit { color: #1976d2; background: #e3f2fd; padding: 4px 8px; font-size: 12px; }
        .btn-details { color: #007bff; background: #f0f7ff; padding: 4px 8px; font-size: 12px; border: 1px solid #bfe3ff; }

        /* Month-wise Summary Accordion */
        .month-card { border: none; margin-bottom: 15px; border-radius: 8px; background-color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow: hidden; }
        .month-header { display: flex; justify-content: space-between; align-items: center; padding: 15px; cursor: pointer; background-color: #fff; -webkit-tap-highlight-color: transparent; }
        .month-header:hover { background-color: #f9fafb; }
        .month-title { font-weight: bold; flex: 1; color: #333; font-size: 15px; }
        .month-totals { font-size: 13px; text-align: right; margin-right: 15px; }
        .debit-text { color: #d32f2f; margin-right: 10px; font-weight: bold; }
        .credit-text { color: #217346; font-weight: bold; }
        .details-btn { color: #007bff; font-size: 13px; font-weight: bold; display: flex; align-items: center; background: #f0f7ff; padding: 4px 8px; border-radius: 4px; border: 1px solid #bfe3ff; }
        .arrow { margin-left: 5px; font-size: 10px; transition: transform 0.3s; }
        .arrow.down { transform: rotate(180deg); }
        .month-details { display: none; padding: 0; border-top: 1px solid #eee; background-color: #fafafa; }
        .month-details.active { display: block; }
        
        .txn-item { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding: 12px 15px; border-bottom: 1px dashed #ddd; font-size: 13px; gap: 10px; }
        .txn-item:last-child { border-bottom: none; }
        .txn-main { flex: 1; min-width: 200px; display: flex; flex-direction: column; gap: 4px; }
        .txn-date-acc { font-size: 11px; color: #777; font-weight: bold; text-transform: uppercase; }
        .txn-purpose { color: #333; font-size: 14px; }
        .txn-amount-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

        /* Nested Accounts Details */
        .acc-details { display: none; padding: 10px 15px; background-color: #fff; border-top: 1px solid #eee; }
        .acc-details.active { display: block; }
        .acc-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 13px; }
        .acc-item:last-child { border-bottom: none; }

        @media (max-width: 650px) {
            .entry-form { grid-template-columns: 1fr; }
            .form-row-bottom { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <h3>1. Accounts Summary</h3>
    <div class="table-container">
        <table id="accountsTable">
            <thead>
                <tr>
                    <th width="25%">Account</th>
                    <th width="20%" class="amt">Opening (₹)</th>
                    <th width="20%" class="amt">Total Spend (₹)</th>
                    <th width="20%" class="amt">Live Balance (₹)</th>
                    <th width="15%" style="text-align:right;">Action</th>
                </tr>
            </thead>
            <tbody id="accountsSummaryBody">
                <!-- Grand Total Row and Expandable Details injected here -->
            </tbody>
            <tbody id="accountsBody" style="display:none;">
                <!-- Individual accounts will be structured inside the toggleable details -->
            </tbody>
            <tfoot>
                <tr style="background: #f9fafb;">
                    <td><input type="text" id="newAccName" placeholder="e.g. SBI, Cash" autocomplete="off" style="padding:4px;"></td>
                    <td><input type="number" id="newAccBal" placeholder="0" class="amt" step="any" style="padding:4px;"></td>
                    <td colspan="3" style="text-align:right;"><button class="btn-add" onclick="addAccount()" style="padding:6px; width:auto;">+ Add Account</button></td>
                </tr>
            </tfoot>
        </table>
    </div>

    <h3>2. Add Transaction</h3>
    <div class="entry-form" id="entryFormSection">
        <div class="input-group">
            <label>Date</label>
            <input type="date" id="entryDate">
        </div>
        <div class="input-group">
            <label>Purpose / Narration</label>
            <input type="text" id="entryPurpose" placeholder="What was this for?" autocomplete="off">
        </div>
        <div class="input-group">
            <label>Account</label>
            <select id="entryAccount"></select>
        </div>
        <div class="form-row-bottom">
            <div class="input-group">
                <label>Money IN (+)</label>
                <input type="number" id="entryIn" placeholder="0" class="amt" step="any">
            </div>
            <div class="input-group">
                <label>Money OUT (-)</label>
                <input type="number" id="entryOut" placeholder="0" class="amt" step="any">
            </div>
            <div class="input-group">
                <button id="saveTxnBtn" class="btn-add" onclick="saveTransaction()">Save Row</button>
            </div>
        </div>
    </div>

    <h3>3. Ledger & Monthly Summary</h3>
    <div id="monthWiseContainer">
        <!-- Monthly accordion cards will generate here -->
    </div>

    <script>
        let editTxnIndex = -1; 

        document.getElementById('entryDate').valueAsDate = new Date();

        function loadData() {
            let accounts = JSON.parse(localStorage.getItem('xls_accounts')) || [];
            let txns = JSON.parse(localStorage.getItem('xls_txns')) || [];
            
            let grandTotalOpening = 0;
            let grandTotalSpend = 0;
            let grandTotalLive = 0;

            const accSummaryBody = document.getElementById('accountsSummaryBody');
            const accSelect = document.getElementById('entryAccount');
            accSelect.innerHTML = '';

            let individualAccountsHtml = '';

            accounts.forEach((acc, index) => {
                let opBal = parseFloat(acc.openingBalance || 0);
                let liveBal = opBal;
                let accSpend = 0;

                txns.filter(t => t.account === acc.name).forEach(t => {
                    liveBal += parseFloat(t.moneyIn || 0);
                    let out = parseFloat(t.moneyOut || 0);
                    liveBal -= out;
                    accSpend += out;
                });

                grandTotalOpening += opBal;
                grandTotalSpend += accSpend;
                grandTotalLive += liveBal;

                individualAccountsHtml += `
                    <div class="acc-item">
                        <div>
                            <strong>${acc.name}</strong><br>
                            <span style="font-size:11px; color:#777;">Op: ₹${opBal.toLocaleString('en-IN')}</span>
                        </div>
                        <div style="text-align:right;">
                            <span>Spend: ₹${accSpend.toLocaleString('en-IN')} | Live: <strong style="color: ${liveBal < 0 ? '#d32f2f' : '#217346'};">₹${liveBal.toLocaleString('en-IN')}</strong></span>
                            <div class="action-btns" style="margin-top:4px;">
                                <button class="btn-edit" onclick="editAccountBalance(${index})">Edit</button>
                                <button class="btn-del" onclick="deleteAccount(${index})">Del</button>
                            </div>
                        </div>
                    </div>
                `;

                accSelect.innerHTML += `<option value="${acc.name}">${acc.name}</option>`;
            });

            // Render Grand Total Summary Row and Details Section
            accSummaryBody.innerHTML = `
                <tr style="background-color: #eef1f6; font-weight: bold; border-top: 2px solid #ccc;">
                    <td>GRAND TOTAL</td>
                    <td class="amt">₹${grandTotalOpening.toLocaleString('en-IN')}</td>
                    <td class="amt" style="color: #d32f2f;">₹${grandTotalSpend.toLocaleString('en-IN')}</td>
                    <td class="amt" style="color: ${grandTotalLive < 0 ? '#d32f2f' : '#217346'};">₹${grandTotalLive.toLocaleString('en-IN')}</td>
                    <td style="text-align:right;">
                        <button class="btn-details" onclick="toggleAccountDetails()">Details <span id="accArrow" class="arrow">▼</span></button>
                    </td>
                </tr>
                <tr>
                    <td colspan="5" style="padding: 0;">
                        <div id="accountDetailsDropdown" class="acc-details">
                            ${individualAccountsHtml || '<div style="padding:10px; color:#777; text-align:center;">No accounts added yet.</div>'}
                        </div>
                    </td>
                </tr>
            `;

            renderMonthlySummary(txns);
        }

        function toggleAccountDetails() {
            const el = document.getElementById('accountDetailsDropdown');
            const arrow = document.getElementById('accArrow');
            el.classList.toggle('active');
            arrow.classList.toggle('down');
        }

        function renderMonthlySummary(txns) {
            const container = document.getElementById('monthWiseContainer');
            container.innerHTML = '';

            if (txns.length === 0) {
                container.innerHTML = '<p style="color: #777; padding: 15px; background: #fff; border-radius: 8px;">No transactions recorded yet.</p>';
                return;
            }

            let txnsWithIndex = txns.map((t, i) => ({ ...t, originalIndex: i }));
            const groupedData = {};

            txnsWithIndex.forEach(t => {
                const dateObj = new Date(t.date);
                const monthKey = dateObj.toLocaleString('en-IN', { month: 'long', year: 'numeric' }); 
                
                if (!groupedData[monthKey]) {
                    groupedData[monthKey] = { debit: 0, credit: 0, transactions: [] };
                }
                
                groupedData[monthKey].credit += parseFloat(t.moneyIn || 0);
                groupedData[monthKey].debit += parseFloat(t.moneyOut || 0);
                groupedData[monthKey].transactions.push(t);
            });

            const sortedMonths = Object.keys(groupedData).sort((a, b) => new Date(b) - new Date(a));

            sortedMonths.forEach(month => {
                const data = groupedData[month];
                const card = document.createElement('div');
                card.className = 'month-card';

                const header = document.createElement('div');
                header.className = 'month-header';
                header.innerHTML = `
                    <div class="month-title">${month}</div>
                    <div class="month-totals">
                        <span class="debit-text">Dr: ₹${data.debit.toLocaleString('en-IN')}</span>
                        <span class="credit-text">Cr: ₹${data.credit.toLocaleString('en-IN')}</span>
                    </div>
                    <div class="details-btn">
                        Details <span class="arrow">▼</span>
                    </div>
                `;

                const detailsDiv = document.createElement('div');
                detailsDiv.className = 'month-details';

                let detailsHtml = '';
                let monthTxns = [...data.transactions].reverse();
                
                monthTxns.forEach(t => {
                    const dateStr = new Date(t.date).toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
                    const isDebit = parseFloat(t.moneyOut || 0) > 0;
                    const amount = isDebit ? t.moneyOut : t.moneyIn;
                    const color = isDebit ? '#d32f2f' : '#217346';
                    const sign = isDebit ? '-' : '+';
                    
                    detailsHtml += `
                        <div class="txn-item">
                            <div class="txn-main">
                                <span class="txn-date-acc">${dateStr} &bull; ${t.account}</span>
                                <span class="txn-purpose">${t.purpose}</span>
                            </div>
                            <div class="txn-amount-actions">
                                <span style="color: ${color}; font-weight: bold; font-size: 15px;">${sign}₹${parseFloat(amount).toLocaleString('en-IN')}</span>
                                <div class="action-btns">
                                    <button class="btn-edit" onclick="loadTransactionForEdit(${t.originalIndex})">Edit</button>
                                    <button class="btn-del" onclick="deleteTransaction(${t.originalIndex})">Del</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
                
                detailsDiv.innerHTML = detailsHtml;

                header.addEventListener('click', () => {
                    detailsDiv.classList.toggle('active');
                    header.querySelector('.arrow').classList.toggle('down');
                });

                card.appendChild(header);
                card.appendChild(detailsDiv);
                container.appendChild(card);
            });
        }

        /* --- Account Functions --- */
        function addAccount() {
            let name = document.getElementById('newAccName').value.trim();
            let bal = document.getElementById('newAccBal').value || 0;
            
            if (!name) return alert("Enter account name");

            let accounts = JSON.parse(localStorage.getItem('xls_accounts')) || [];
            
            if (accounts.some(a => a.name.toLowerCase() === name.toLowerCase())) {
                return alert("An account with this name already exists.");
            }

            accounts.push({ name: name, openingBalance: bal });
            localStorage.setItem('xls_accounts', JSON.stringify(accounts));
            
            document.getElementById('newAccName').value = '';
            document.getElementById('newAccBal').value = '';
            loadData();
        }

        function editAccountBalance(index) {
            let accounts = JSON.parse(localStorage.getItem('xls_accounts')) || [];
            let acc = accounts[index];
            
            let newBal = prompt(`Enter new opening balance for ${acc.name}:`, acc.openingBalance);
            
            if (newBal !== null && newBal.trim() !== "") {
                acc.openingBalance = parseFloat(newBal);
                localStorage.setItem('xls_accounts', JSON.stringify(accounts));
                loadData();
            }
        }

        function deleteAccount(index) {
            let accounts = JSON.parse(localStorage.getItem('xls_accounts')) || [];
            let txns = JSON.parse(localStorage.getItem('xls_txns')) || [];
            
            let accName = accounts[index].name;
            if (txns.some(t => t.account === accName)) {
                return alert("Cannot delete. This account has transactions in the ledger.");
            }

            if(!confirm(`Delete account: ${accName}?`)) return;

            accounts.splice(index, 1);
            localStorage.setItem('xls_accounts', JSON.stringify(accounts));
            loadData();
        }

        /* --- Transaction Functions --- */
        function loadTransactionForEdit(index) {
            let txns = JSON.parse(localStorage.getItem('xls_txns')) || [];
            let t = txns[index];

            document.getElementById('entryDate').value = t.date;
            document.getElementById('entryPurpose').value = t.purpose;
            document.getElementById('entryAccount').value = t.account;
            document.getElementById('entryIn').value = t.moneyIn || '';
            document.getElementById('entryOut').value = t.moneyOut || '';

            editTxnIndex = index;
            
            let saveBtn = document.getElementById('saveTxnBtn');
            saveBtn.innerText = 'Update Row';
            saveBtn.style.backgroundColor = '#1976d2';
            
            document.getElementById('entryFormSection').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function saveTransaction() {
            let date = document.getElementById('entryDate').value;
            let purpose = document.getElementById('entryPurpose').value.trim();
            let account = document.getElementById('entryAccount').value;
            let mIn = document.getElementById('entryIn').value || 0;
            let mOut = document.getElementById('entryOut').value || 0;

            if (!account) return alert("Create an account first!");
            if (mIn == 0 && mOut == 0) return alert("Enter money in or money out");

            let txns = JSON.parse(localStorage.getItem('xls_txns')) || [];
            
            let newTxnData = {
                date: date,
                purpose: purpose,
                account: account,
                moneyIn: parseFloat(mIn),
                moneyOut: parseFloat(mOut)
            };

            if (editTxnIndex >= 0) {
                txns[editTxnIndex] = newTxnData;
                editTxnIndex = -1; 
                
                let saveBtn = document.getElementById('saveTxnBtn');
                saveBtn.innerText = 'Save Row';
                saveBtn.style.backgroundColor = '#217346';
            } else {
                txns.push(newTxnData);
            }

            localStorage.setItem('xls_txns', JSON.stringify(txns));

            document.getElementById('entryPurpose').value = '';
            document.getElementById('entryIn').value = '';
            document.getElementById('entryOut').value = '';
            document.getElementById('entryDate').valueAsDate = new Date();
            loadData();
        }

        function deleteTransaction(index) {
            if(!confirm("Delete this transaction?")) return;
            let txns = JSON.parse(localStorage.getItem('xls_txns')) || [];
            txns.splice(index, 1);
            localStorage.setItem('xls_txns', JSON.stringify(txns));
            
            if(editTxnIndex === index) {
                editTxnIndex = -1;
                document.getElementById('entryPurpose').value = '';
                document.getElementById('entryIn').value = '';
                document.getElementById('entryOut').value = '';
                document.getElementById('entryDate').valueAsDate = new Date();
                let saveBtn = document.getElementById('saveTxnBtn');
                saveBtn.innerText = 'Save Row';
                saveBtn.style.backgroundColor = '#217346';
            }

            loadData();
        }

        // Initialize App
        loadData();
    </script>
</body>
</html>
